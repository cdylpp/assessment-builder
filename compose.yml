services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: assessments
    ports:
      - "5432:5432"
    volumes:
      - assessment_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d assessments"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/assessments
      EXECL_SERVICE_URL: http://excel-service:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
  
  excel-service:
    build: ./excel-service
    ports:
      - "8001:8001"
    volumes:
      - ./excel-service:/app
    
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http//localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  assessment_pgdata:
